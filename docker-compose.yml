services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: curriculos-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?defina SA_PASSWORD no arquivo .env}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
volumes:
  sqldata:
